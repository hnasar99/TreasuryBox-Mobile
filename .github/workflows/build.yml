name: build

on:
  push:
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [celo, twin]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --flavor ${{ matrix.flavor }} -t lib/main_${{ matrix.flavor }}.dart --dart-define-from-file=env/${{ matrix.flavor }}.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: build/app/outputs/flutter-apk/*.apk
